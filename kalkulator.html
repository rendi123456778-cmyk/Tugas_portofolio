<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator - Rendi Sanjana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="icon" href="img/profil.jpg" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="img/favicon-32x32.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>

  <body
    class="bg-[#E8DCC4] text-[#123F36] min-h-screen flex items-center justify-center px-4"
  >
    <section class="max-w-md w-full">
      <a
        href="index.html"
        class="inline-block mb-6 text-sm text-[#123F36]/70 hover:text-[#123F36] transition"
        >&larr; Kembali ke Portofolio</a
      >

      <h1 class="text-2xl font-bold text-center mb-8">Kalkulator Sederhana</h1>

      <div
        class="bg-white border border-[#C49A45]/30 rounded-lg p-6 flex flex-col gap-4 shadow-sm"
      >
        <input
          id="angka1"
          type="number"
          placeholder="Angka pertama"
          class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-[#2A6B5C]"
        />

        <input
          id="angka2"
          type="number"
          placeholder="Angka kedua"
          class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-[#2A6B5C]"
        />

        <div class="grid grid-cols-4 gap-2">
          <button
            onclick="hitung('+')"
            class="bg-[#2A6B5C] text-white rounded-md py-2 hover:bg-[#123F36] transition"
          >
            +
          </button>
          <button
            onclick="hitung('-')"
            class="bg-[#2A6B5C] text-white rounded-md py-2 hover:bg-[#123F36] transition"
          >
            -
          </button>
          <button
            onclick="hitung('*')"
            class="bg-[#2A6B5C] text-white rounded-md py-2 hover:bg-[#123F36] transition"
          >
            &times;
          </button>
          <button
            onclick="hitung('/')"
            class="bg-[#2A6B5C] text-white rounded-md py-2 hover:bg-[#123F36] transition"
          >
            &divide;
          </button>
        </div>

        <p class="text-center text-lg font-semibold mt-2">
          Hasil: <span id="hasil" class="text-[#C49A45]">0</span>
        </p>
      </div>
    </section>

    <script src="kalkulator.js"></script>
  </body>
</html>
